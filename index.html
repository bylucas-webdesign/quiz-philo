                    { text: "Elle permet d'unifier toutes nos expériences multiples dans un même « je pense »[cite: 8].", isCorrect: true, rationale: "Exact ! Le « je pense » accompagne nos représentations et bâtit notre identité malgré la diversité des vécus[cite: 8]." },
                    { text: "Elle permet de douter de tout pour prouver l'existence de l'esprit pensant[cite: 4, 9].", isCorrect: false, rationale: "C'est le rôle du cogito chez Descartes[cite: 4, 9]." },
                    { text: "Elle sert à distinguer immédiatement le bien du mal grâce à la pitié naturelle[cite: 1, 6].", isCorrect: false, rationale: "C'est la conscience morale, notamment chez Rousseau[cite: 1, 6]." },
                    { text: "Elle connecte l'individu à l'ensemble de la nature par le monisme[cite: 10].", isCorrect: false, rationale: "C'est la position de Spinoza[cite: 10]." }
                ]
            },
            {
                category: "À retenir : Kant",
                question: "Quel est le résumé de la pensée de Kant sur la conscience[cite: 8]?",
                options: [
                    { text: "La conscience unifie toutes nos expériences dans un même « je »[cite: 8].", isCorrect: true, rationale: "Parfait ! C'est la clé de voûte de sa théorie de l'identité personnelle[cite: 8]." },
                    { text: "Conscience -> pensée -> cogito[cite: 9].", isCorrect: false, rationale: "C'est le résumé de Descartes[cite: 9]." },
                    { text: "L'Homme fait partie de la nature contre le dualisme[cite: 10].", isCorrect: false, rationale: "C'est le résumé de Spinoza[cite: 10]." },
                    { text: "La conscience n'est ni divine ni sacrée[cite: 11].", isCorrect: false, rationale: "C'est le résumé de Nietzsche[cite: 11]." }
                ]
            },

            // Descartes
            {
                category: "Auteur : Descartes",
                question: "Comment Descartes parvient-il à découvrir la première vérité certaine[cite: 9]?",
                options: [
                    { text: "En utilisant le doute méthodique pour rejeter tout ce qui est douteux, révélant que le fait de penser prouve l'existence[cite: 9].", isCorrect: true, rationale: "Exact ! C'est le mécanisme du cogito (« Je pense donc je suis »)[cite: 4, 9]." },
                    { text: "En analysant le sens commun et les croyances inconscientes de sa classe sociale[cite: 5].", isCorrect: false, rationale: "C'est la méthode critique de Gramsci[cite: 5]." },
                    { text: "En unifiant la multiplicité des sensations à travers le transcendantal[cite: 4, 8].", isCorrect: false, rationale: "C'est la démarche de Kant[cite: 4, 8]." },
                    { text: "En constatant la misère physique de l'Homme face à l'immensité de l'univers[cite: 7].", isCorrect: false, rationale: "C'est l'approche de Pascal[cite: 7]." }
                ]
            },
            {
                category: "Auteur : Descartes",
                question: "Quelle distinction fondamentale Descartes opère-t-il entre le corps et l'esprit[cite: 9]?",
                options: [
                    { text: "Le corps est une réalité matérielle appartenant à la nature, tandis que l'esprit est une réalité pensante (le dualisme)[cite: 9].", isCorrect: true, rationale: "Parfait ! Cette dissociation corps/esprit est la base du dualisme cartésien[cite: 2, 9]." },
                    { text: "Le corps et l'esprit ne forment qu'une seule et même substance naturelle[cite: 10].", isCorrect: false, rationale: "C'est l'opposé exact, soutenu par le monisme de Spinoza[cite: 10]." },
                    { text: "Le corps est bon par nature alors que l'esprit est corrompu par la société[cite: 6].", isCorrect: false, rationale: "C'est une adaptation erronée de la théorie de Rousseau[cite: 6]." },
                    { text: "Le corps est un simple produit des échanges sociaux et des interactions collectives[cite: 11].", isCorrect: false, rationale: "C'est l'origine sociale de la conscience selon Nietzsche[cite: 11]." }
                ]
            },
            {
                category: "À retenir : Descartes",
                question: "Quels mots-clés résument la doctrine de Descartes[cite: 9]?",
                options: [
                    { text: "Conscience -> pensée -> cogito ; corps et esprit distincts -> dualisme[cite: 9].", isCorrect: true, rationale: "Exact ! C'est le résumé officiel de la fiche de révision[cite: 9]." },
                    { text: "L'Homme fait partie de la nature -> opposition au dualisme -> monisme[cite: 10].", isCorrect: false, rationale: "C'est le résumé de Spinoza[cite: 10]." },
                    { text: "L'Homme naturel est bon ; la société le corrompt[cite: 6].", isCorrect: false, rationale: "C'est le résumé de Rousseau[cite: 6]." },
                    { text: "La conscience unifie toutes nos expériences dans un même « je »[cite: 8].", isCorrect: false, rationale: "C'est le résumé de Kant[cite: 8]." }
                ]
            },

            // Spinoza
            {
                category: "Auteur : Spinoza",
                question: "Pourquoi Spinoza refuse-t-il de voir l'Homme comme un « empire dans un empire »[cite: 10]?",
                options: [
                    { text: "Parce que l'Homme n'est pas une réalité séparée du reste de la nature : il y fait pleinement partie[cite: 10].", isCorrect: true, rationale: "Exact ! C'est le fondement du monisme spinoziste, s'opposant au dualisme de Descartes[cite: 3, 10]." },
                    { text: "Parce que l'Homme a été corrompu par les lois artificielles de la civilisation[cite: 6].", isCorrect: false, rationale: "C'est l'argument de Rousseau[cite: 6]." },
                    { text: "Parce que la conscience humaine tire sa source unique des échanges marchands[cite: 11].", isCorrect: false, rationale: "C'est l'analyse de Nietzsche[cite: 11]." },
                    { text: "Parce que l'esprit pensant domine souverainement la matière corporelle[cite: 2, 9].", isCorrect: false, rationale: "C'est la vision dualiste rejetée par Spinoza[cite: 2, 9, 10]." }
                ]
            },
            {
                category: "À retenir : Spinoza",
                question: "Quel est le résumé de la théorie de Spinoza[cite: 10]?",
                options: [
                    { text: "L'Homme fait partie de la nature -> opposition au dualisme -> monisme[cite: 10].", isCorrect: true, rationale: "Parfait ! C'est la synthèse exacte de sa position philosophique[cite: 10]." },
                    { text: "Conscience -> pensée -> cogito[cite: 9].", isCorrect: false, rationale: "C'est le résumé de Descartes[cite: 9]." },
                    { text: "La conscience unifie toutes nos expériences dans un même « je »[cite: 8].", isCorrect: false, rationale: "C'est le résumé de Kant[cite: 8]." },
                    { text: "Prendre conscience de sa pensée et développer un esprit critique[cite: 5].", isCorrect: false, rationale: "C'est le résumé de Gramsci[cite: 5]." }
                ]
            },

            // Nietzsche
            {
                category: "Auteur : Nietzsche",
                question: "Comment Nietzsche qualifie-t-il la conscience humaine par rapport aux idées traditionnelles[cite: 11]?",
                options: [
                    { text: "Il remet en question son caractère divin, sacré ou supérieur, la jugeant non constitutive d'un privilège cosmique[cite: 11].", isCorrect: true, rationale: "Exact ! Il participe à un renversement des valeurs en déconstruisant son aura sacrée[cite: 11]." },
                    { text: "Il affirme qu'elle est la source absolue de toute vérité par le cogito cartésien[cite: 4, 9].", isCorrect: false, rationale: "C'est l'exact opposé de sa démarche critique[cite: 9, 11]." },
                    { text: "Il soutient qu'elle unifie transcendantalement le monde sensible[cite: 4, 8].", isCorrect: false, rationale: "C'est la vision de Kant[cite: 4, 8]." },
                    { text: "Il en fait l'attribut principal d'une substance spirituelle séparée du corps[cite: 2, 9].", isCorrect: false, rationale: "C'est le dualisme que Nietzsche ne défend pas[cite: 2, 9, 11]." }
                ]
            },
            {
                category: "Auteur : Nietzsche",
                question: "Comment Nietzsche explique-t-il l'origine de la conscience[cite: 11]?",
                options: [
                    { text: "Elle est notamment liée aux échanges entre les hommes et à la vie en société[cite: 11].", isCorrect: true, rationale: "Parfait ! Elle n'est pas un donné absolu, mais s'explique à partir des relations sociales[cite: 11]." },
                    { text: "Elle découle d'une révélation métaphysique obtenue par le doute méthodique[cite: 3, 9].", isCorrect: false, rationale: "C'est la méthode de Descartes[cite: 3, 9]." },
                    { text: "Elle émerge de la pitié et de la bonté naturelle de l'état de nature[cite: 6].", isCorrect: false, rationale: "C'est la description de Rousseau[cite: 6]." },
                    { text: "Elle est le produit d'une philosophie spontanée enfouie dans le sens commun[cite: 5].", isCorrect: false, rationale: "C'est l'approche de Gramsci[cite: 5]." }
                ]
            },
            {
                category: "À retenir : Nietzsche",
                question: "Quelle phrase résume l'analyse de Nietzsche sur la conscience[cite: 11]?",
                options: [
                    { text: "La conscience n'est ni divine ni sacrée ; son origine est liée aux échanges entre les hommes[cite: 11].", isCorrect: true, rationale: "Exact ! C'est le résumé clé de sa fiche[cite: 11]." },
                    { text: "L'Homme naturel est bon ; la société peut le corrompre[cite: 6].", isCorrect: false, rationale: "C'est le résumé de Rousseau[cite: 6]." },
                    { text: "L'Homme est misérable par sa faiblesse mais grand par sa pensée[cite: 7].", isCorrect: false, rationale: "C'est le résumé de Pascal[cite: 7]." },
                    { text: "L'Homme fait partie de la nature -> monisme[cite: 10].", isCorrect: false, rationale: "C'est le résumé de Spinoza[cite: 10]." }
                ]
            }
        ];

        let quizData = [];
        let currentIndex = 0;
        let score = 0;
        let answeredQuestionsCount = 0;
        let answered = false;

        const totalQuestionsEl = document.getElementById('question-total');
        const currentQuestionEl = document.getElementById('question-current');
        const currentScoreEl = document.getElementById('current-score');
        const answeredCountEl = document.getElementById('answered-count');
        const progressBar = document.getElementById('progress-bar');
        const categoryEl = document.getElementById('question-category');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const nextBtn = document.getElementById('next-btn');
        const quizContainer = document.getElementById('quiz-container');
        const resultScreen = document.getElementById('result-screen');
        const finalMessage = document.getElementById('final-message');

        function initQuiz() {
            // Copie et mélange aléatoire de TOUTES les questions pour le mode infini/complet
            quizData = [...masterQuizData].sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;
            answeredQuestionsCount = 0;
            
            currentScoreEl.textContent = score;
            answeredCountEl.textContent = answeredQuestionsCount;
            totalQuestionsEl.textContent = quizData.length;
            
            resultScreen.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            explanationBox.classList.add('hidden');
            nextBtn.classList.add('hidden');
            
            const currentData = quizData[currentIndex];
            currentQuestionEl.textContent = currentIndex + 1;
            categoryEl.textContent = currentData.category;
            questionTextEl.textContent = currentData.question;
            
            progressBar.style.width = `${(currentIndex / quizData.length) * 100}%`;

            // Mélanger les options pour éviter les biais de position
            const shuffledOptions = [...currentData.options].sort(() => Math.random() - 0.5);

            optionsContainer.innerHTML = '';
            shuffledOptions.forEach((option) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl bg-slate-700/60 hover:bg-slate-700 border border-slate-600 transition duration-200 text-slate-200 font-medium text-sm md:text-base";
                btn.textContent = option.text;
                btn.onclick = () => selectOption(btn, option, currentData.options);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedBtn, selectedOption, allOptions) {
            if (answered) return;
            answered = true;
            answeredQuestionsCount++;
            answeredCountEl.textContent = answeredQuestionsCount;

            const buttons = optionsContainer.children;
            for (let btn of buttons) {
                btn.disabled = true;
                const optText = btn.textContent;
                const originalOpt = allOptions.find(o => o.text === optText);
                
                if (originalOpt.isCorrect) {
                    btn.classList.remove('bg-slate-700/60', 'border-slate-600');
                    btn.classList.add('bg-emerald-900/60', 'border-emerald-500', 'text-emerald-200');
                } else if (btn === selectedBtn) {
                    btn.classList.remove('bg-slate-700/60', 'border-slate-600');
                    btn.classList.add('bg-rose-900/60', 'border-rose-500', 'text-rose-200');
                }
            }

            if (selectedOption.isCorrect) {
                score++;
                currentScoreEl.textContent = score;
            }

            explanationText.textContent = selectedOption.rationale;
            explanationBox.className = `p-4 rounded-xl mb-6 text-sm border ${selectedOption.isCorrect ? 'bg-emerald-950/50 border-emerald-700 text-emerald-200' : 'bg-rose-950/50 border-rose-700 text-rose-200'}`;
            explanationBox.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            progressBar.style.width = '100%';

            let percentage = Math.round((score / answeredQuestionsCount) * 100);
            let msg = `Tu as obtenu un score de <span class="font-bold text-indigo-300">${score} / ${answeredQuestionsCount}</span> (${percentage}% de réussite sur l'ensemble des fiches).<br><br>Le mode infini te permet de relancer une nouvelle session avec un brassage aléatoire complet de toutes les questions !`;
            finalMessage.innerHTML = msg;
        }

        function restartQuiz() {
            initQuiz();
        }

        // Lancement initial du quiz complet
        initQuiz();
    </script>
</body>
</html>
